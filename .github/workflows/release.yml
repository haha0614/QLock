name: release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Test
        shell: pwsh
        run: |
          # 新编译的 exe 偶尔被杀软拦几秒，重试几次再判失败。
          for ($i = 1; $i -le 3; $i++) {
            cmd /c test.cmd
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "test run $i failed with exit $LASTEXITCODE, retrying in 20s"
            Start-Sleep -Seconds 20
          }
          exit 1

      - name: Pack
        shell: pwsh
        run: ./tools/pack.ps1

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/QLock.exe
            dist/SHA256SUMS.txt
          body: |
            QLock 0.3.0

            - `QLock.exe`：单文件，双击运行，不需要管理员权限
            - `SHA256SUMS.txt`：校验用，`Get-FileHash QLock.exe -Algorithm SHA256` 对照即可

            这一版是 WPF 实现的最后一个版本。之后主分支改用 C++ 原生直绘重写，
            这份 WPF 源码留在仓库的 `wpf` 分支，需要旧版时可以从那里取。

            几点说明：

            - 这是软锁，`Ctrl+Alt+Del` 能绕过（安全界面里可以直接结束进程）
            - 未签名，SmartScreen 会提示"未知发布者"，不放心就对一下哈希
            - 想彻底替代系统锁屏，还得在 Windows 里关掉登录、屏保、唤醒时的锁屏，见 README
